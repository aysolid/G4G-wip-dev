<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G4G - Staff Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #3b82f6;
      --secondary-color: #7c3aed;
      --success-color: #10b981;
      --warning-color: #f59e0b;
      --danger-color: #ef4444;

      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);

      --border-radius: 8px;
      --border-radius-lg: 12px;
      --transition: all 0.2s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: white;
      border-radius: var(--border-radius-lg);
      box-shadow: var(--shadow-xl);
      overflow: hidden;
    }

    .login-header {
      background: var(--gray-50);
      padding: 2rem;
      text-align: center;
      border-bottom: 1px solid var(--gray-200);
    }

    .login-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      border-radius: var(--border-radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      color: white;
    }

    .login-logo .material-icons {
      font-size: 32px;
    }

    .login-header h1 {
      font-size: 1.5rem;
      color: var(--gray-900);
      margin-bottom: 0.25rem;
    }

    .login-header p {
      color: var(--gray-500);
      font-size: 0.875rem;
    }

    .login-body {
      padding: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--gray-700);
      margin-bottom: 0.5rem;
    }

    .form-input-wrapper {
      position: relative;
    }

    .form-input-wrapper .material-icons {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400);
      font-size: 20px;
    }

    .form-input {
      width: 100%;
      padding: 12px 12px 12px 44px;
      border: 2px solid var(--gray-200);
      border-radius: var(--border-radius);
      font-size: 1rem;
      transition: var(--transition);
      background: white;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .form-input::placeholder {
      color: var(--gray-400);
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--gray-400);
      padding: 4px;
    }

    .password-toggle:hover {
      color: var(--gray-600);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: var(--border-radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      background: var(--gray-300);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .alert {
      padding: 12px 16px;
      border-radius: var(--border-radius);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.875rem;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger-color);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success-color);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .alert .material-icons {
      font-size: 20px;
    }

    .hidden {
      display: none !important;
    }

    .login-footer {
      padding: 1.5rem 2rem;
      background: var(--gray-50);
      border-top: 1px solid var(--gray-200);
      text-align: center;
    }

    .back-link {
      color: var(--gray-500);
      text-decoration: none;
      font-size: 0.875rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: var(--transition);
    }

    .back-link:hover {
      color: var(--primary-color);
    }

    .back-link .material-icons {
      font-size: 18px;
    }

    /* Loading spinner */
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Role badges info */
    .role-info {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--gray-200);
    }

    .role-info-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--gray-500);
      margin-bottom: 0.75rem;
    }

    .role-badges {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: var(--gray-100);
      border-radius: 20px;
      font-size: 0.75rem;
      color: var(--gray-600);
    }

    .role-badge .material-icons {
      font-size: 14px;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-header {
        padding: 1.5rem;
      }

      .login-body {
        padding: 1.5rem;
      }

      .login-footer {
        padding: 1rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <span class="material-icons">videogame_asset</span>
        </div>
        <h1>Staff Login</h1>
        <p>G4G Research Operations</p>
      </div>

      <div class="login-body">
        <!-- Error Alert -->
        <div id="errorAlert" class="alert alert-error hidden">
          <span class="material-icons">error</span>
          <span id="errorMessage">Invalid username or password</span>
        </div>

        <!-- Success Alert -->
        <div id="successAlert" class="alert alert-success hidden">
          <span class="material-icons">check_circle</span>
          <span id="successMessage">Login successful! Redirecting...</span>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <div class="form-input-wrapper">
              <span class="material-icons">person</span>
              <input
                type="text"
                id="username"
                class="form-input"
                placeholder="Enter your username"
                required
                autocomplete="username"
              >
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="form-input-wrapper">
              <span class="material-icons">lock</span>
              <input
                type="password"
                id="password"
                class="form-input"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
              >
              <button type="button" class="password-toggle" onclick="togglePassword()">
                <span class="material-icons" id="passwordToggleIcon">visibility</span>
              </button>
            </div>
          </div>

          <button type="submit" id="loginBtn" class="btn btn-primary">
            <span id="loginBtnText">Sign In</span>
            <div id="loginSpinner" class="spinner hidden"></div>
          </button>
        </form>

        <div class="role-info">
          <div class="role-info-title">User Roles</div>
          <div class="role-badges">
            <span class="role-badge">
              <span class="material-icons">admin_panel_settings</span>
              Admin
            </span>
            <span class="role-badge">
              <span class="material-icons">science</span>
              Facilitator
            </span>
            <span class="role-badge">
              <span class="material-icons">visibility</span>
              Viewer
            </span>
          </div>
        </div>
      </div>

      <div class="login-footer">
        <a href="<?= ScriptApp.getService().getUrl() ?>" class="back-link">
          <span class="material-icons">arrow_back</span>
          Back to Dashboard
        </a>
      </div>
    </div>
  </div>

  <script>
    // Store the web app URL for navigation
    const WEB_APP_URL = '<?= ScriptApp.getService().getUrl() ?>';

    // Toggle password visibility
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('passwordToggleIcon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.textContent = 'visibility_off';
      } else {
        passwordInput.type = 'password';
        toggleIcon.textContent = 'visibility';
      }
    }

    // Handle login form submission
    function handleLogin(event) {
      event.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      // Hide any existing alerts
      document.getElementById('errorAlert').classList.add('hidden');
      document.getElementById('successAlert').classList.add('hidden');

      // Show loading state
      const loginBtn = document.getElementById('loginBtn');
      const loginBtnText = document.getElementById('loginBtnText');
      const loginSpinner = document.getElementById('loginSpinner');

      loginBtn.disabled = true;
      loginBtnText.textContent = 'Signing in...';
      loginSpinner.classList.remove('hidden');

      // Call server-side authentication
      google.script.run
        .withSuccessHandler(handleLoginSuccess)
        .withFailureHandler(handleLoginError)
        .authenticateUser(username, password);
    }

    // Handle successful login
    function handleLoginSuccess(result) {
      const loginBtn = document.getElementById('loginBtn');
      const loginBtnText = document.getElementById('loginBtnText');
      const loginSpinner = document.getElementById('loginSpinner');

      if (result.success) {
        // Store session token for the current tab only
        sessionStorage.setItem('g4g_token', result.token);

        // Show success message
        document.getElementById('successAlert').classList.remove('hidden');
        document.getElementById('successMessage').textContent = 'Welcome, ' + result.user.fullName + '! Redirecting...';

        // Redirect to dashboard
        setTimeout(function() {
          window.location.href = WEB_APP_URL + '?page=dashboard';
        }, 1000);
      } else {
        // Show error
        showError(result.message || 'Invalid username or password');
        resetLoginButton();
      }
    }

    // Handle login error
    function handleLoginError(error) {
      showError('An error occurred. Please try again.');
      resetLoginButton();
      console.error('Login error:', error);
    }

    // Show error message
    function showError(message) {
      const errorAlert = document.getElementById('errorAlert');
      const errorMessage = document.getElementById('errorMessage');
      errorMessage.textContent = message;
      errorAlert.classList.remove('hidden');
    }

    // Reset login button state
    function resetLoginButton() {
      const loginBtn = document.getElementById('loginBtn');
      const loginBtnText = document.getElementById('loginBtnText');
      const loginSpinner = document.getElementById('loginSpinner');

      loginBtn.disabled = false;
      loginBtnText.textContent = 'Sign In';
      loginSpinner.classList.add('hidden');
    }

    document.addEventListener('DOMContentLoaded', function() {
      setupLogoutRefreshWatcher();
      sessionStorage.removeItem('g4g_token');
      sessionStorage.removeItem('g4g_user');
    });

    let logoutRefreshTimer = null;

    function setupLogoutRefreshWatcher() {
      const storedLogoutAt = localStorage.getItem('g4g_logout_at');
      if (storedLogoutAt) {
        scheduleLogoutRefresh(parseInt(storedLogoutAt, 10));
      }

      window.addEventListener('storage', function(event) {
        if (event.key === 'g4g_logout_at' && event.newValue) {
          scheduleLogoutRefresh(parseInt(event.newValue, 10));
        }
      });
    }

    function scheduleLogoutRefresh(logoutAt) {
      if (!logoutAt || Number.isNaN(logoutAt)) return;
      if (logoutRefreshTimer) return;
      const elapsed = Date.now() - logoutAt;
      const delay = Math.max(0, 5000 - elapsed);
      logoutRefreshTimer = setTimeout(function() {
        localStorage.removeItem('g4g_logout_at');
        window.location.reload();
      }, delay);
    }
  </script>
</body>
</html>
